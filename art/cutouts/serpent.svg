<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 200" width="230" height="200">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1c140a" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a8c3a"/><stop offset="1" stop-color="#2c4022"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6e6a8"/><stop offset="1" stop-color="#c79a5a"/>
    </radialGradient>
  </defs>
  <g filter="url(#ds)" stroke="#efe2c4" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- the coiled body in S-shape, head raised -->
    <path d="M30 168 Q60 140 100 156 Q140 168 140 130 Q140 96 174 90"
          stroke="url(#body)" stroke-width="22" fill="none"/>
    <!-- the tail curling under -->
    <path d="M30 168 Q14 158 22 144" stroke="url(#body)" stroke-width="20" fill="none"/>
  </g>
  <!-- scale pattern on body -->
  <g stroke="#3a5028" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M50 162 Q56 158 62 162"/>
    <path d="M76 152 Q82 148 88 152"/>
    <path d="M104 158 Q110 154 116 158"/>
    <path d="M130 140 Q136 136 142 140"/>
    <path d="M134 116 Q140 112 146 116"/>
  </g>
  <!-- the head, raised -->
  <g filter="url(#ds)" stroke="#efe2c4" stroke-width="3.5" stroke-linejoin="round">
    <!-- head shape with horns and jaw -->
    <path d="M170 92 Q166 70 184 64 Q204 64 206 84 Q206 96 196 100 L190 92 L186 100 L180 92 L176 100 L170 92 Q166 96 170 92 Z"
          fill="url(#body)"/>
    <!-- horn -->
    <path d="M178 64 L172 48 L186 60 Z" fill="#3a5028" stroke="#efe2c4" stroke-width="2"/>
    <!-- the eye -->
    <circle cx="190" cy="80" r="4.5" fill="url(#eye)" stroke="#1c140a" stroke-width="1"/>
    <!-- the nostril -->
    <circle cx="200" cy="88" r="1.5" fill="#1c140a"/>
  </g>
  <!-- forked tongue flicking out -->
  <g stroke="#c64a3a" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M206 92 L218 86"/>
    <path d="M218 86 L222 80"/>
    <path d="M218 86 L222 92"/>
  </g>
</svg>
