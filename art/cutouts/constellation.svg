<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0a1224" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#1a2440"/><stop offset="1" stop-color="#0a1224"/>
    </radialGradient>
    <radialGradient id="big" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6e6a8"/><stop offset="1" stop-color="#f6e6a800"/>
    </radialGradient>
    <radialGradient id="sml" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0d4a0"/><stop offset="1" stop-color="#e0d4a000"/>
    </radialGradient>
  </defs>
  <!-- the celestial circle — the sky divided into ordered stations -->
  <g filter="url(#ds)">
    <circle cx="120" cy="120" r="98" fill="url(#bg)"/>
    <circle cx="120" cy="120" r="98" fill="none" stroke="#d9af52" stroke-width="2"/>
    <circle cx="120" cy="120" r="98" fill="none" stroke="#efe2c4" stroke-width="3.5"/>
  </g>
  <!-- 12 stations of the celestial circle -->
  <g fill="#d9af52" stroke="#efe2c4" stroke-width="1.5">
    <circle cx="120" cy="22" r="3.5"/>
    <circle cx="214" cy="120" r="3.5"/>
    <circle cx="120" cy="218" r="3.5"/>
    <circle cx="26" cy="120" r="3.5"/>
  </g>
  <g fill="#b5862f" stroke="#efe2c4" stroke-width="1">
    <circle cx="170" cy="34" r="2.6"/>
    <circle cx="206" cy="170" r="2.6"/>
    <circle cx="70" cy="206" r="2.6"/>
    <circle cx="34" cy="70" r="2.6"/>
  </g>
  <g fill="#9a6f38" stroke="#efe2c4" stroke-width="0.8">
    <circle cx="190" cy="50" r="2"/>
    <circle cx="190" cy="190" r="2"/>
    <circle cx="50" cy="190" r="2"/>
    <circle cx="50" cy="50" r="2"/>
  </g>
  <!-- the seven stars (Pleiades) — the centerpiece -->
  <g>
    <circle cx="98" cy="98" r="18" fill="url(#big)"/>
    <circle cx="130" cy="86" r="16" fill="url(#big)"/>
    <circle cx="115" cy="115" r="17" fill="url(#big)"/>
    <circle cx="150" cy="110" r="15" fill="url(#big)"/>
    <circle cx="138" cy="138" r="14" fill="url(#sml)"/>
    <circle cx="172" cy="138" r="13" fill="url(#sml)"/>
    <circle cx="162" cy="162" r="12" fill="url(#sml)"/>
    <g fill="#f6e6a8" stroke="#d9af52" stroke-width="0.8">
      <circle cx="98" cy="98" r="3.6"/>
      <circle cx="130" cy="86" r="3.2"/>
      <circle cx="115" cy="115" r="3.4"/>
      <circle cx="150" cy="110" r="3"/>
      <circle cx="138" cy="138" r="2.6"/>
      <circle cx="172" cy="138" r="2.4"/>
      <circle cx="162" cy="162" r="2"/>
    </g>
  </g>
  <!-- connecting lines showing the ordered pattern of the seven -->
  <g stroke="#d9af52" stroke-width="0.9" fill="none" opacity="0.45">
    <path d="M98 98 L130 86 L150 110 L172 138 L162 162"/>
    <path d="M98 98 L115 115 L138 138"/>
    <path d="M115 115 L150 110"/>
  </g>
  <!-- scattered field stars -->
  <g fill="#e0d4a0" opacity="0.7">
    <circle cx="60" cy="50" r="1.2"/>
    <circle cx="190" cy="65" r="1"/>
    <circle cx="55" cy="160" r="1.4"/>
    <circle cx="180" cy="180" r="1.2"/>
    <circle cx="80" cy="180" r="0.8"/>
    <circle cx="200" cy="145" r="0.8"/>
  </g>
</svg>