<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <filter id="ds" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0c0a06" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdbf94"/><stop offset="1" stop-color="#8a7a4a"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8d4ad"/><stop offset="1" stop-color="#bca872"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6e6a8"/><stop offset="1" stop-color="#f6e6a800"/>
    </radialGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6e6a8"/><stop offset="1" stop-color="#f6e6a800"/>
    </radialGradient>
  </defs>
  <!-- the radiant halo (multi-point star, behind the figure) -->
  <circle cx="100" cy="56" r="64" fill="url(#halo)"/>
  <g stroke="#d9af52" stroke-width="2" opacity="0.5">
    <line x1="100" y1="0" x2="100" y2="20"/>
    <line x1="100" y1="96" x2="100" y2="116"/>
    <line x1="42" y1="58" x2="62" y2="58"/>
    <line x1="138" y1="58" x2="158" y2="58"/>
    <line x1="58" y1="16" x2="72" y2="30"/>
    <line x1="128" y1="86" x2="142" y2="100"/>
    <line x1="58" y1="100" x2="72" y2="86"/>
    <line x1="128" y1="30" x2="142" y2="16"/>
  </g>
  <g filter="url(#ds)" stroke="#efe2c4" stroke-width="3.5" stroke-linejoin="round">
    <!-- left wing (large, spread) -->
    <path d="M84 96 Q22 60 4 110 Q44 96 60 116 Q26 130 10 152 Q56 132 80 152 Z" fill="url(#wing)"/>
    <!-- right wing (large, spread) -->
    <path d="M116 96 Q178 60 196 110 Q156 96 140 116 Q174 130 190 152 Q144 132 120 152 Z" fill="url(#wing)"/>
    <!-- robe body -->
    <path d="M72 92 Q100 76 128 92 L144 250 L56 250 Z" fill="url(#robe)"/>
    <!-- head -->
    <circle cx="100" cy="56" r="22" fill="#e8d4ad"/>
  </g>
  <!-- decorative robe lines -->
  <g stroke="#9a8a5a" stroke-width="2" fill="none" opacity="0.55">
    <path d="M100 92 L100 246"/>
    <path d="M40 124 Q60 124 86 134"/>
    <path d="M160 124 Q140 124 114 134"/>
    <path d="M70 162 Q100 168 130 162"/>
    <path d="M64 200 Q100 208 136 200"/>
  </g>
  <!-- the star held in the figure's hand — the knowledge of the heavens the Watchers brought -->
  <g>
    <circle cx="74" cy="172" r="22" fill="url(#star)"/>
    <path d="M74 156 L78 168 L90 170 L80 178 L83 190 L74 182 L65 190 L68 178 L58 170 L70 168 Z"
          fill="#f6e6a8" stroke="#d9af52" stroke-width="2"/>
  </g>
</svg>