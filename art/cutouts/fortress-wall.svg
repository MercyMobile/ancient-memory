<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" width="280" height="210">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1c140a" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2b189"/><stop offset="1" stop-color="#7f7050"/>
    </linearGradient>
    <linearGradient id="twr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbba92"/><stop offset="1" stop-color="#8a7a56"/>
    </linearGradient>
  </defs>
  <g filter="url(#ds)" stroke="#efe2c4" stroke-width="4" stroke-linejoin="round">
    <!-- curtain wall -->
    <rect x="14" y="96" width="252" height="110" fill="url(#wall)"/>
    <!-- battlements along the curtain -->
    <g fill="url(#wall)">
      <rect x="92"  y="78" width="20" height="20"/>
      <rect x="124" y="78" width="20" height="20"/>
      <rect x="156" y="78" width="20" height="20"/>
    </g>
    <!-- flanking towers, "fortified up to heaven" -->
    <rect x="26"  y="44" width="58" height="162" fill="url(#twr)"/>
    <rect x="196" y="44" width="58" height="162" fill="url(#twr)"/>
    <g fill="url(#twr)">
      <rect x="26"  y="28" width="18" height="18"/>
      <rect x="52"  y="28" width="18" height="18"/>
      <rect x="196" y="28" width="18" height="18"/>
      <rect x="222" y="28" width="18" height="18"/>
    </g>
    <!-- the gate, never taken -->
    <path d="M116 206 L116 146 Q140 122 164 146 L164 206 Z" fill="#3a2818"/>
  </g>
  <g stroke="#5a4c34" stroke-width="2" fill="none" opacity="0.5">
    <!-- cyclopean courses -->
    <line x1="14" y1="126" x2="266" y2="126"/>
    <line x1="14" y1="158" x2="266" y2="158"/>
    <line x1="14" y1="188" x2="266" y2="188"/>
    <path d="M60 96 L60 126 M180 96 L180 126 M100 126 L100 158 M212 158 L212 188"/>
    <!-- arrow slits -->
    <path d="M55 74 L55 96 M225 74 L225 96" stroke="#3a2818" stroke-width="6" opacity="0.8"/>
  </g>
</svg>
