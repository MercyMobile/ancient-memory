name: Build and verify NASB 1995 accuracy corrections
on:
  push:
    branches: [codex/nasb95-accuracy-corrections]
    paths: [.github/workflows/copy-audit-work.yml]
permissions:
  contents: write
concurrency:
  group: nasb95-accuracy-review
  cancel-in-progress: false
jobs:
  accuracy:
    if: github.ref == 'refs/heads/codex/nasb95-accuracy-corrections'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/nasb95-accuracy-corrections
          fetch-depth: 0
      - name: Install the existing build and browser-test dependencies
        run: |
          python3 -m pip install 'Pillow==11.3.0' 'playwright==1.63.0'
          python3 -m playwright install --with-deps chromium
      - name: Apply the locally verified, exact-base accuracy migration
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          root=Path.cwd().resolve()
          encoded=''.join((root/f'tools/accuracy-payload.part{i}').read_text().strip() for i in (1,2))
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'f2343be7bcadcb62587df1bd1b515ca3d30f6cd5c51f85737994d7d087f6372b', 'Payload checksum mismatch'
          payload=json.loads(raw)
          assert payload['base']=='2062e813f3b55e1787120a059458c52535789e55'
          subprocess.run(['git','merge-base','--is-ancestor',payload['base'],'HEAD'],check=True)
          def edit(s, edits):
              for start,end,value in reversed(edits):
                  assert 0 <= start <= end <= len(s)
                  s=s[:start]+value+s[end:]
              return s
          for entry in payload['files']:
              path=(root/entry['path']).resolve()
              assert path.is_relative_to(root) and '.git' not in path.relative_to(root).parts
              if entry['sha256_before'] is None:
                  assert not path.exists(), 'Refusing to overwrite new file '+entry['path']
                  output=entry['content'].encode('utf-8')
              else:
                  original=path.read_bytes()
                  assert hashlib.sha256(original).hexdigest()==entry['sha256_before'], 'Base changed: '+entry['path']
                  text=original.decode('utf-8')
                  if 'ops' in entry:
                      data=json.loads(text)
                      for op in entry['ops']:
                          parent=data
                          for key in op['path'][:-1]: parent=parent[key]
                          key=op['path'][-1]
                          parent[key]=op['value'] if 'value' in op else edit(parent[key],op['edits'])
                      text=json.dumps(data,ensure_ascii=False,indent=entry['indent'])+'\n'
                  else:
                      text=edit(text,entry['edits'])
                  output=text.encode('utf-8')
              assert hashlib.sha256(output).hexdigest()==entry['sha256_after'], 'Output mismatch: '+entry['path']
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(output)
              print('Verified',entry['path'],flush=True)
          Path('/tmp/accuracy-allowed.json').write_text(json.dumps([f['path'] for f in payload['files']]))
          PY
      - name: Rebuild every reading edition and reference index
        run: |
          python3 tools/build_reference_docs.py
          python3 tools/build_standalone.py
          python3 tools/build_text.py
      - name: Validate exact excerpts, all audit dispositions, and protected assets
        run: |
          python3 tools/test_copy_accuracy.py
          python3 tools/test_mazzaroth.py
          node --check js/engine.js
          git diff --check -- . ':!download/the-world-remembers.md'
          test -z "$(git diff --name-only -- art css js data/atlas.json)"
      - name: Browser-test every chapter and reading mode
        run: python3 tools/test_page_visibility.py --output "$RUNNER_TEMP/accuracy-browser"
      - name: Save browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nasb95-accuracy-browser-evidence
          path: ${{ runner.temp }}/accuracy-browser/
          retention-days: 14
      - name: Commit only the verified review changes
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          allowed=set(json.loads(Path('/tmp/accuracy-allowed.json').read_text())) | {'SOURCES.md','llms.txt','index.html','the-world-remembers.html','download/the-world-remembers.html','download/the-world-remembers.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert (changed | untracked) <= allowed, 'Unexpected edits: '+str((changed | untracked)-allowed)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore NASB 1995 quotations and resolve copy-audit accuracy issues'
          git push origin HEAD:refs/heads/codex/nasb95-accuracy-corrections
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
