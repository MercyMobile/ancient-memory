name: Build reviewed Mazzaroth revision

on:
  push:
    branches: [codex/mazzaroth-evidence-etymology]
    paths: [tools/apply_mazzaroth_revision.py, .github/workflows/mazzaroth-revision.yml]

permissions:
  contents: write

concurrency:
  group: mazzaroth-evidence-revision
  cancel-in-progress: false

jobs:
  revise-and-check:
    if: github.ref == 'refs/heads/codex/mazzaroth-evidence-etymology'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mazzaroth-evidence-etymology
          fetch-depth: 2
      - name: Install the existing bundle builder's image dependency
        run: python3 -m pip install 'Pillow==11.3.0'
      - name: Apply the approved chapter revision
        run: |
          python3 tools/apply_mazzaroth_revision.py
          python3 -c "from pathlib import Path; p = Path('SOURCES.md'); p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')"
      - name: Rebuild both reading editions
        run: |
          python3 tools/build_standalone.py
          python3 tools/build_text.py
      - name: Validate chapter, generated copies, and JavaScript
        run: |
          python3 tools/test_mazzaroth.py
          node --check js/engine.js
          git diff --check -- . ':!download/the-world-remembers.md'
      - name: Commit only the reviewed revision on its non-production branch
        env:
          REVISION_BRANCH: codex/mazzaroth-evidence-etymology
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {
              'data/chapters/mazzaroth.json', 'data/book.json', 'SOURCES.md',
              'index.html', 'the-world-remembers.html',
              'download/the-world-remembers.html', 'download/the-world-remembers.md',
              'tools/test_mazzaroth.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          unexpected = (changed | untracked) - allowed
          if unexpected:
              raise SystemExit('Unexpected changes: ' + ', '.join(sorted(unexpected)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/chapters/mazzaroth.json data/book.json SOURCES.md index.html the-world-remembers.html download/the-world-remembers.html download/the-world-remembers.md tools/test_mazzaroth.py
          git commit -m 'Ground Mazzaroth chapter in Hebrew evidence and measured stellar dynamics'
          git push origin "HEAD:refs/heads/$REVISION_BRANCH"
          printf 'Revision committed and validated: ' >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
