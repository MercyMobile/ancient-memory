name: Repair and verify mobile chapter visibility

on:
  push:
    branches: [codex/fix-mobile-page-overlap]
    paths: [.github/workflows/mobile-layout-repair.yml, tools/test_page_visibility.py]

permissions:
  contents: write

concurrency:
  group: mobile-layout-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/codex/fix-mobile-page-overlap'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/fix-mobile-page-overlap
          fetch-depth: 2
      - name: Install build and browser-test dependencies
        run: |
          python3 -m pip install 'Pillow==11.3.0' 'playwright==1.63.0'
          python3 -m playwright install --with-deps chromium
      - name: Reproduce the current mobile visibility defect
        run: python3 tools/test_page_visibility.py --baseline --output "$RUNNER_TEMP/storybook-layout"
      - name: Apply the focused page-state repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('js/engine.js')
          sha = subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip()
          assert sha == '91efa7ce8cd0661c0f4305a909b7e5f2153afeef', 'Engine changed; review and reconcile first'
          s = p.read_text()
          def replace_once(old, new):
              global s
              assert s.count(old) == 1, ('Expected one patch location', old)
              s = s.replace(old, new, 1)
          replace_once("  const REDUCED = matchMedia('(prefers-reduced-motion:reduce)').matches;", "  const REDUCED = matchMedia('(prefers-reduced-motion:reduce)').matches;\n  // Keep the page-state model in sync with the flat mobile/reduced-motion CSS.\n  const FLAT_BOOK = matchMedia('(max-width:640px), (prefers-reduced-motion:reduce)');")
          replace_once("      p.style.zIndex = flipped ? i : (N - i);", "      p.style.zIndex = flipped ? i : (N - i);\n      p.classList.toggle('is-current', i === current);\n      p.inert = i !== current;\n      p.setAttribute('aria-hidden', String(i !== current));")
          replace_once("      if (REDUCED) {\n        // fade model: only the current page is shown", "      if (FLAT_BOOK.matches) {\n        // Phones and reduced-motion layouts paint only the active chapter.\n        // Explicitly hide unread pages; z-index alone does not isolate them.")
          replace_once("        p.style.opacity = '';\n        p.style.pointerEvents = '';\n        p.style.visibility = '';", "        p.style.opacity = '';\n        p.style.pointerEvents = (i === current) ? '' : 'none';\n        p.style.visibility = (i > current) ? 'hidden' : '';")
          replace_once("  function wire() {\n    $('#next').onclick = next;", "  function wire() {\n    // Reapply page isolation when rotating a phone or changing motion settings.\n    FLAT_BOOK.addEventListener('change', updatePages);\n    $('#next').onclick = next;")
          p.write_text(s)
          PY
      - name: Rebuild and validate the storybook without editing its content
        run: |
          python3 tools/build_standalone.py
          python3 tools/test_mazzaroth.py
          node --check js/engine.js
          git diff --check
          test -z "$(git diff --name-only -- data art css SOURCES.md download/the-world-remembers.md)"
      - name: Browser-test chapters, reading modes, rotation, and accessibility
        run: python3 tools/test_page_visibility.py --output "$RUNNER_TEMP/storybook-layout"
      - name: Save before and after browser screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mobile-layout-browser-evidence
          path: ${{ runner.temp }}/storybook-layout/
          retention-days: 14
      - name: Commit the verified repair on the review branch
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {'js/engine.js', 'index.html', 'the-world-remembers.html', 'download/the-world-remembers.html'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed <= allowed, ('Unexpected edits', changed - allowed)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/engine.js index.html the-world-remembers.html download/the-world-remembers.html
          git commit -m 'Hide inactive mobile chapters and synchronize flat-book page state'
          git push origin HEAD:refs/heads/codex/fix-mobile-page-overlap
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
